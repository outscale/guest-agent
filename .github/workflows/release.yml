name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix shell github:nix-community/fenix?ref=ba9210be006df88ed8c14562f97ad4b4ffb048a0#stable.defaultToolchain --command "env" | egrep "^PATH=" >>"${GITHUB_ENV}"
      - name: patch vendored libzmq
        run: |
          pushd zmq-src/vendor
          git apply ../zmq.diff
          popd
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libclang-dev libsodium-dev
      - name: Install packaging tools
        run: |
          cargo install --locked cargo-deb --version 3.8.0
          cargo install --locked cargo-generate-rpm --version 0.21.0
      - name: Build packages
        run: |
          cargo build --release --locked -p guest-agent
          cargo deb -p guest-agent --no-build
          cargo generate-rpm -p guest-agent --target "${CARGO_BUILD_TARGET}"
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          CARGO_BUILD_TARGET: "x86_64-unknown-linux-gnu"
      - name: Generate and sign checksums
        env:
          VERSION: ${{ github.event.release.tag_name }}
          CARGO_BUILD_TARGET: "x86_64-unknown-linux-gnu"
        run: |
          (cd target/debian && sha256sum *.deb) > "guest-agent_${VERSION}_checksums.txt"
          (cd "target/${CARGO_BUILD_TARGET}/generate-rpm" && sha256sum *.rpm) >> "guest-agent_${VERSION}_checksums.txt"
          cosign sign-blob --yes --bundle "guest-agent_${VERSION}_checksums.txt.sigstore.json" "guest-agent_${VERSION}_checksums.txt"
      - name: Upload release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/debian/*.deb \
            target/x86_64-unknown-linux-gnu/generate-rpm/*.rpm \
            "guest-agent_${RELEASE_TAG}_checksums.txt" \
            "guest-agent_${RELEASE_TAG}_checksums.txt.sigstore.json" \
            --clobber
