name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix shell github:nix-community/fenix?ref=ba9210be006df88ed8c14562f97ad4b4ffb048a0#stable.defaultToolchain --command "env" | egrep "^PATH=" >>"${GITHUB_ENV}"
      - name: patch vendored libzmq
        run: |
          pushd zmq-src/vendor
          git apply ../zmq.diff
          popd
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libclang-dev libsodium-dev
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
