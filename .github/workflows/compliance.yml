name: Compliance

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Plumber
      uses: outscale/.github/pipeline-compliance@cc76c3e03f3c7a83a09914b1ed65b7fea5605fb8 # main
      with:
        plumber-threshold: 100
        github-token: ${{ secrets.GITHUB_TOKEN }}
